{% extends "base.html" %}

{% block title %}Settings - WRIS Wallet{% endblock %}

{% block content %}
<div class="card">
    <h2 class="glitter-text">Settings</h2>
    
    <form onsubmit="handleSettingsSave(event)">
        <div class="form-group">
            <label for="theme">Theme</label>
            <select id="theme" name="theme">
                <option value="light">Light (Default)</option>
                <option value="dark">Dark</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="language">Language</label>
            <select id="language" name="language">
                <option value="en">English</option>
                <option value="id">Indonesian (Bahasa Indonesia)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="currency">Default Currency</label>
            <select id="currency" name="currency">
                <option value="usd">USD</option>
                <option value="eur">EUR</option>
                <option value="idr">IDR</option>
            </select>
        </div>
        
        <button type="submit" class="button">Save Settings</button>
    </form>
    
    <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--light-purple);">
    
    <h3>Danger Zone</h3>
    <button onclick="handleExportWallet()" class="button button-secondary">📥 Export Seed Phrase</button>
    <button onclick="handleResetWallet()" class="button" style="background: #EF4444; margin-left: 1rem;">🗑️ Reset Wallet</button>
</div>

<script>
function handleSettingsSave(event) {
    event.preventDefault();
    app.showAlert('Settings saved successfully!', 'success');
}

function handleExportWallet() {
    const password = prompt('Enter your password to export seed phrase:');
    if (password) {
        // Implementation for exporting wallet
        app.showAlert('Seed phrase export feature coming soon!', 'info');
    }
}

function handleResetWallet() {
    if (confirm('⚠️ This action cannot be undone! Are you sure you want to reset your wallet?')) {
        // Implementation for resetting wallet
        app.showAlert('Wallet reset feature coming soon!', 'info');
    }
}
</script>
{% endblock %}
